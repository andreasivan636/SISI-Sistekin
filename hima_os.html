<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SISI AI Assistant | Sistekin UNTAG Surabaya</title>
  <meta name="description" content="SISI AI Assistant — Asisten AI cerdas berbasis Ollama Llama-3 (70B) untuk mahasiswa Sistekin UNTAG Surabaya." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    :root {
      --neon-blue: #00d4ff;
      --neon-purple: #a855f7;
      --neon-cyan: #06b6d4;
      --dark-bg: #030712;
      --dark-panel: #0a0f1e;
      --dark-card: #0d1530;
      --border-glow: rgba(0, 212, 255, 0.3);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--dark-bg);
      overflow: hidden;
      height: 100vh;
    }

    /* ─── Circuit Board SVG Background ─── */
    .circuit-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(168,85,247,0.07) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(0,212,255,0.07) 0%, transparent 60%),
        #030712;
    }
    .circuit-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .circuit-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 10% 30%, rgba(0,212,255,0.06) 2px, transparent 2px),
        radial-gradient(circle at 90% 70%, rgba(168,85,247,0.06) 2px, transparent 2px),
        radial-gradient(circle at 50% 10%, rgba(0,212,255,0.04) 2px, transparent 2px);
      background-size: 120px 120px, 150px 150px, 200px 200px;
    }

    /* ─── Glowing Panel ─── */
    .glow-panel {
      background: linear-gradient(135deg, rgba(13,21,48,0.95) 0%, rgba(10,15,30,0.98) 100%);
      border: 1px solid rgba(0,212,255,0.2);
      box-shadow:
        0 0 20px rgba(0,212,255,0.08),
        0 0 60px rgba(168,85,247,0.05),
        inset 0 1px 0 rgba(0,212,255,0.1);
      backdrop-filter: blur(12px);
    }

    /* ─── Neon Text ─── */
    .neon-text-blue {
      color: #00d4ff;
      text-shadow: 0 0 10px rgba(0,212,255,0.8), 0 0 20px rgba(0,212,255,0.4);
    }
    .neon-text-purple {
      color: #a855f7;
      text-shadow: 0 0 10px rgba(168,85,247,0.8), 0 0 20px rgba(168,85,247,0.4);
    }
    .font-orbitron { font-family: 'Orbitron', monospace; }
    .font-mono-tech { font-family: 'Share Tech Mono', monospace; }

    /* ─── Sidebar Nav Button ─── */
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      color: rgba(200,220,255,0.75);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: left;
      font-family: 'Inter', sans-serif;
    }
    .nav-btn:hover, .nav-btn.active {
      background: rgba(0,212,255,0.08);
      border-color: rgba(0,212,255,0.3);
      color: #00d4ff;
      box-shadow: 0 0 12px rgba(0,212,255,0.15), inset 0 0 8px rgba(0,212,255,0.05);
      transform: translateX(3px);
    }
    .nav-btn.primary {
      background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(168,85,247,0.1));
      border-color: rgba(0,212,255,0.4);
      color: #00d4ff;
    }
    .nav-btn.primary:hover {
      background: linear-gradient(135deg, rgba(0,212,255,0.25), rgba(168,85,247,0.2));
      box-shadow: 0 0 20px rgba(0,212,255,0.3);
      transform: translateX(3px);
    }
    .nav-btn.danger {
      color: rgba(255,100,100,0.7);
    }
    .nav-btn.danger:hover {
      background: rgba(255,60,60,0.1);
      border-color: rgba(255,100,100,0.4);
      color: #ff6b6b;
      box-shadow: 0 0 12px rgba(255,60,60,0.2);
      transform: translateX(3px);
    }

    /* ─── Chat Bubbles ─── */
    .chat-bubble-user {
      background: linear-gradient(135deg, rgba(168,85,247,0.2), rgba(99,102,241,0.15));
      border: 1px solid rgba(168,85,247,0.3);
      border-radius: 16px 4px 16px 16px;
      padding: 12px 16px;
      max-width: 75%;
      margin-left: auto;
      color: rgba(230,220,255,0.95);
      font-size: 0.875rem;
      line-height: 1.6;
      box-shadow: 0 0 15px rgba(168,85,247,0.1);
    }
    .chat-bubble-ai {
      background: linear-gradient(135deg, rgba(0,212,255,0.1), rgba(6,182,212,0.08));
      border: 1px solid rgba(0,212,255,0.25);
      border-radius: 4px 16px 16px 16px;
      padding: 12px 16px;
      max-width: 75%;
      color: rgba(200,240,255,0.95);
      font-size: 0.875rem;
      line-height: 1.6;
      box-shadow: 0 0 15px rgba(0,212,255,0.08);
    }

    /* ─── Status Bar ─── */
    .status-bar {
      background: linear-gradient(90deg, rgba(0,212,255,0.05), rgba(168,85,247,0.05));
      border-bottom: 1px solid rgba(0,212,255,0.15);
      padding: 10px 18px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
    }

    /* ─── Input Area ─── */
    .chat-input {
      background: rgba(10,15,30,0.9);
      border: 1px solid rgba(0,212,255,0.2);
      border-radius: 12px;
      color: rgba(200,230,255,0.9);
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      outline: none;
      transition: all 0.25s;
      resize: none;
    }
    .chat-input:focus {
      border-color: rgba(0,212,255,0.5);
      box-shadow: 0 0 20px rgba(0,212,255,0.15);
    }
    .chat-input::placeholder {
      color: rgba(100,150,200,0.4);
    }

    /* ─── Icon Buttons ─── */
    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      border: 1px solid rgba(0,212,255,0.2);
      background: rgba(0,212,255,0.05);
      color: rgba(0,212,255,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .icon-btn:hover {
      background: rgba(0,212,255,0.15);
      border-color: rgba(0,212,255,0.5);
      color: #00d4ff;
      box-shadow: 0 0 12px rgba(0,212,255,0.3);
      transform: scale(1.05);
    }
    .icon-btn.send {
      background: linear-gradient(135deg, rgba(0,212,255,0.3), rgba(168,85,247,0.2));
      border-color: rgba(0,212,255,0.5);
      color: #00d4ff;
      width: 44px;
      height: 44px;
    }
    .icon-btn.send:hover {
      background: linear-gradient(135deg, rgba(0,212,255,0.5), rgba(168,85,247,0.4));
      box-shadow: 0 0 20px rgba(0,212,255,0.4);
    }

    /* ─── Circuit Frame for Character ─── */
    .circuit-frame {
      position: relative;
      border: 1px solid rgba(0,212,255,0.3);
      border-radius: 16px;
      background: radial-gradient(ellipse at center, rgba(0,212,255,0.05) 0%, transparent 70%);
      box-shadow:
        0 0 30px rgba(0,212,255,0.12),
        0 0 60px rgba(168,85,247,0.08),
        inset 0 0 40px rgba(0,212,255,0.03);
      overflow: hidden;
      padding: 10px;
    }
    .circuit-frame::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .circuit-corner {
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: rgba(0,212,255,0.6);
      border-style: solid;
    }
    .circuit-corner.tl { top: 6px; left: 6px; border-width: 2px 0 0 2px; }
    .circuit-corner.tr { top: 6px; right: 6px; border-width: 2px 2px 0 0; }
    .circuit-corner.bl { bottom: 6px; left: 6px; border-width: 0 0 2px 2px; }
    .circuit-corner.br { bottom: 6px; right: 6px; border-width: 0 2px 2px 0; }

    /* ─── Status Indicators ─── */
    .status-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(0,212,255,0.15);
      background: rgba(0,212,255,0.04);
      cursor: pointer;
      transition: all 0.25s;
      font-size: 0.65rem;
      color: rgba(150,200,230,0.6);
    }
    .status-indicator:hover {
      border-color: rgba(0,212,255,0.4);
      background: rgba(0,212,255,0.1);
      color: #00d4ff;
      box-shadow: 0 0 12px rgba(0,212,255,0.2);
    }
    .status-indicator.green { border-color: rgba(34,197,94,0.3); }
    .status-indicator.green:hover { border-color: rgba(34,197,94,0.6); color: #22c55e; box-shadow: 0 0 12px rgba(34,197,94,0.3); }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(0,212,255,0.2);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0,212,255,0.4); }

    /* ─── Pulse Animations ─── */
    @keyframes pulse-glow {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px currentColor; }
      50% { opacity: 0.6; box-shadow: 0 0 16px currentColor; }
    }
    @keyframes blink-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes scan-line {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }
    @keyframes float-char {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: pulse-glow 2s ease-in-out infinite;
    }
    .pulse-dot.blue { background: #00d4ff; color: #00d4ff; }
    .pulse-dot.green { background: #22c55e; color: #22c55e; }
    .pulse-dot.purple { background: #a855f7; color: #a855f7; }

    .blink { animation: blink-dot 1.5s ease-in-out infinite; }

    .float-anim { animation: float-char 3s ease-in-out infinite; }

    .gradient-title {
      background: linear-gradient(90deg, #00d4ff, #a855f7, #00d4ff);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient-shift 4s ease infinite;
    }

    /* Scanline effect on circuit frame */
    .scan-line-effect {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      border-radius: 16px;
    }
    .scan-line-effect::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 60px;
      background: linear-gradient(transparent, rgba(0,212,255,0.04), transparent);
      animation: scan-line 4s linear infinite;
    }

    /* Divider */
    .neon-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,212,255,0.3), transparent);
      margin: 10px 0;
    }

    /* Typing indicator */
    @keyframes typing-dot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }
    .typing-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00d4ff;
      animation: typing-dot 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    /* Hover lift */
    .hover-lift {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .hover-lift:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ═══════════════════════════════════════════════
   SVG ICONS
═══════════════════════════════════════════════ */
const Icons = {
  Plus: () => (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  ),
  History: () => (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
      <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
    </svg>
  ),
  Settings: () => (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  ),
  Logout: () => (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
      <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
    </svg>
  ),
  Send: () => (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round">
      <line x1="22" y1="2" x2="11" y2="13"/>
      <polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
  ),
  Upload: () => (
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
  ),
  Bot: () => (
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
      <rect x="3" y="11" width="18" height="11" rx="2"/><circle cx="12" cy="5" r="2"/>
      <path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/>
    </svg>
  ),
  Think: () => (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
  ),
  Wave: () => (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
      <path d="M18 8h1a4 4 0 0 1 0 8h-1"/>
      <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
      <line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/>
    </svg>
  ),
  Check: () => (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  ),
  Cpu: () => (
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round">
      <rect x="4" y="4" width="16" height="16" rx="2"/>
      <rect x="9" y="9" width="6" height="6"/>
      <line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/>
      <line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/>
      <line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="15" x2="23" y2="15"/>
      <line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="15" x2="4" y2="15"/>
    </svg>
  ),
};

/* ═══════════════════════════════════════════════
   TIME COMPONENT
═══════════════════════════════════════════════ */
function LiveClock() {
  const [time, setTime] = useState(new Date());
  useEffect(() => {
    const t = setInterval(() => setTime(new Date()), 1000);
    return () => clearInterval(t);
  }, []);
  const fmt = (n) => String(n).padStart(2, '0');
  return (
    <span className="font-mono-tech" style={{ color: 'rgba(0,212,255,0.5)', fontSize: '0.72rem' }}>
      {fmt(time.getHours())}:{fmt(time.getMinutes())}:{fmt(time.getSeconds())}
    </span>
  );
}

/* ═══════════════════════════════════════════════
   LEFT SIDEBAR
═══════════════════════════════════════════════ */
function Sidebar({ activeNav, setActiveNav }) {
  return (
    <div className="glow-panel flex flex-col" style={{
      width: '230px',
      minWidth: '230px',
      height: '100%',
      borderRadius: '0 0 0 0',
      borderRight: '1px solid rgba(0,212,255,0.15)',
      borderTop: 'none',
      borderBottom: 'none',
      borderLeft: 'none',
      position: 'relative',
      zIndex: 10,
    }}>
      {/* ─── Header ─── */}
      <div style={{
        padding: '20px 18px 16px',
        borderBottom: '1px solid rgba(0,212,255,0.1)',
        background: 'linear-gradient(180deg, rgba(0,212,255,0.05) 0%, transparent 100%)',
      }}>
        <div className="flex items-center gap-2 mb-1">
          <div style={{
            width: '32px', height: '32px', borderRadius: '8px',
            background: 'linear-gradient(135deg, rgba(0,212,255,0.2), rgba(168,85,247,0.2))',
            border: '1px solid rgba(0,212,255,0.4)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            boxShadow: '0 0 12px rgba(0,212,255,0.2)',
          }}>
            <Icons.Cpu />
          </div>
          <div>
            <div className="font-orbitron gradient-title" style={{ fontSize: '0.72rem', fontWeight: 700, letterSpacing: '0.05em' }}>
              SISI
            </div>
            <div style={{ fontSize: '0.6rem', color: 'rgba(100,150,200,0.5)', marginTop: '1px' }}>
              AI ASSISTANT
            </div>
          </div>
        </div>
        <div className="neon-divider" />
        <div style={{
          fontSize: '0.7rem',
          color: 'rgba(100,150,200,0.55)',
          fontFamily: 'Share Tech Mono, monospace',
          display: 'flex',
          alignItems: 'center',
          gap: '6px',
        }}>
          <div className="pulse-dot blue" style={{ width: '6px', height: '6px' }} />
          Model: Ollama Llama-3 (70B)
        </div>
      </div>

      {/* ─── Navigation ─── */}
      <div style={{ padding: '14px 12px', flex: 1, display: 'flex', flexDirection: 'column', gap: '6px' }}>
        <button
          id="btn-new-chat"
          className={`nav-btn primary`}
          onClick={() => setActiveNav('new')}
          style={{ marginBottom: '4px' }}
        >
          <Icons.Plus />
          + Percakapan Baru
        </button>

        <div className="neon-divider" />

        <div style={{ fontSize: '0.65rem', color: 'rgba(100,150,200,0.35)', fontFamily: 'Share Tech Mono', paddingLeft: '4px', marginBottom: '2px', letterSpacing: '0.08em' }}>
          NAVIGASI
        </div>

        <button
          id="btn-history"
          className={`nav-btn ${activeNav === 'history' ? 'active' : ''}`}
          onClick={() => setActiveNav('history')}
        >
          <Icons.History />

═══════════════════════════════════════════════ */
function ChatMessage({ msg, isNew }) {
  const isUser = msg.role === 'user';
  const [visible, setVisible] = useState(!isNew);
  useEffect(() => {
    if (isNew) {
      const t = setTimeout(() => setVisible(true), 50);
      return () => clearTimeout(t);
    }
  }, []);

  return (
    <div
      className="flex"
      style={{
        justifyContent: isUser ? 'flex-end' : 'flex-start',
        marginBottom: '16px',
        opacity: visible ? 1 : 0,
        transform: visible ? 'translateY(0)' : 'translateY(12px)',
        transition: 'opacity 0.35s ease, transform 0.35s ease',
      }}
    >
      {!isUser && (
        <div style={{
          width: '30px', height: '30px', borderRadius: '50%',
          background: 'linear-gradient(135deg, rgba(0,212,255,0.2), rgba(168,85,247,0.2))',

          marginRight: '8px', flexShrink: 0, marginTop: '2px',
          boxShadow: '0 0 10px rgba(0,212,255,0.15)',

        }}>
          <Icons.Bot />
        </div>
      )}
      <div className={isUser ? 'chat-bubble-user' : 'chat-bubble-ai'}>
        {!isUser && (
          <div className="font-mono-tech mb-1" style={{ fontSize: '0.68rem', color: 'rgba(0,212,255,0.6)' }}>
            SISI ▸
          </div>
        )}
        {msg.content}
        <div style={{
          fontSize: '0.65rem',
          marginTop: '6px',
          color: isUser ? 'rgba(168,85,247,0.4)' : 'rgba(0,212,255,0.35)',

/* ═══════════════════════════════════════════════
   CENTER PANEL
═══════════════════════════════════════════════ */
function ChatPanel({ messages, setMessages, isTyping, setIsTyping }) {
  const [input, setInput] = useState('');
  const bottomRef = useRef(null);
  const textRef = useRef(null);

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages, isTyping]);

  const sendMessage = () => {
    const text = input.trim();
    if (!text) return;
    const now = new Date();
    const fmt = (n) => String(n).padStart(2, '0');
    const timeStr = `${fmt(now.getHours())}:${fmt(now.getMinutes())}`;
    const userMsg = { role: 'user', content: text, time: timeStr, id: Date.now() };
    setMessages(prev => [...prev, userMsg]);
    setInput('');
    setIsTyping(true);

    // Simulate AI reply
    setTimeout(() => {
      setIsTyping(false);
      const replies = [
        "Tentu! Saya SISI, asisten AI SISTEKIN UNTAG Surabaya. Saya siap membantu Anda dengan informasi seputar program studi, pendaftaran, jadwal kuliah, atau pertanyaan akademik lainnya. 📚",
        "Terima kasih atas pertanyaannya! Program studi Sistem dan Teknologi Informasi (Sistekin) UNTAG Surabaya menawarkan kurikulum komprehensif yang mencakup pemrograman, desain UX, infrastruktur jaringan, dan kecerdasan buatan.",
        "Untuk informasi lebih lanjut, Anda dapat mengunjungi website resmi UNTAG Surabaya atau menghubungi bagian akademik. Apakah ada hal spesifik yang ingin Anda ketahui lebih dalam? 🎓",
        "Siap! Saya akan membantu Anda menemukan informasi yang tepat. Program Sistekin memiliki dua penjurusan: CSBA (Cyber System & Business Analytics) dan SDF (Security & Digital Forensics). Keduanya sangat relevan dengan kebutuhan industri digital saat ini.",
      ];
      const aiMsg = {
        role: 'ai',
        content: replies[Math.floor(Math.random() * replies.length)],
        time: fmt(new Date().getHours()) + ':' + fmt(new Date().getMinutes()),
        id: Date.now(),
        isNew: true,
      };
      setMessages(prev => [...prev, aiMsg]);
    }, 1800 + Math.random() * 800);
  };

  const handleKey = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  };

  return (
    <div className="flex flex-col" style={{ flex: 1, height: '100%', overflow: 'hidden', position: 'relative', zIndex: 5 }}>
      {/* ─── Status Bar ─── */}
      <div className="status-bar flex items-center justify-between">
        <div className="flex items-center gap-2">
          <div className="pulse-dot green" />
          <span className="font-mono-tech" style={{ fontSize: '0.75rem', color: 'rgba(34,197,94,0.8)' }}>
            SISI: Online
          </span>
          <span style={{ color: 'rgba(100,150,200,0.3)', fontSize: '0.7rem' }}>|</span>
          <span className="font-mono-tech" style={{ fontSize: '0.72rem', color: 'rgba(0,212,255,0.6)' }}>
            Model: Advanced Llama-3 (Ollama)
          </span>
        </div>
        <div className="flex items-center gap-3">
          <span className="font-mono-tech" style={{ fontSize: '0.7rem', color: 'rgba(100,150,200,0.4)' }}>
            CTX: 70B params
          </span>
          <div className="flex gap-1">
            {[0.7, 0.9, 1.0, 0.8, 0.6].map((h, i) => (
              <div key={i} style={{
                width: '3px',
                height: `${h * 16}px`,
                background: `rgba(0,212,255,${h * 0.6})`,
                borderRadius: '2px',
                alignSelf: 'flex-end',
              }} />
            ))}
          </div>
          <LiveClock />
        </div>
      </div>

      {/* ─── Messages Area ─── */}
      <div style={{
        flex: 1,
        overflowY: 'auto',
        padding: '20px 24px',
        background: 'rgba(3,7,18,0.3)',
      }}>
        {/* Welcome hint */}
        {messages.length === 0 && (
          <div style={{ textAlign: 'center', padding: '40px 20px', color: 'rgba(100,150,200,0.3)' }}>
            <div style={{ fontSize: '2rem', marginBottom: '12px' }}>🤖</div>
            <div className="font-orbitron" style={{ fontSize: '0.9rem', color: 'rgba(0,212,255,0.4)', marginBottom: '6px' }}>
              SISI Ready
            </div>
            <div style={{ fontSize: '0.8rem' }}>Mulai percakapan baru dengan SISI</div>
          </div>
        )}

        {messages.map((msg) => (
          <ChatMessage key={msg.id} msg={msg} isNew={msg.isNew} />
        ))}

        {isTyping && <TypingIndicator />}
        <div ref={bottomRef} />
      </div>

      {/* ─── Input Area ─── */}
      <div style={{
        padding: '14px 18px',
        borderTop: '1px solid rgba(0,212,255,0.1)',
        background: 'rgba(10,15,30,0.8)',
        backdropFilter: 'blur(10px)',
      }}>
        <div className="flex items-end gap-3">
          {/* Upload btn */}
          <button id="btn-upload" className="icon-btn" title="Unggah File" style={{ marginBottom: '1px' }}>
            <Icons.Upload />
          </button>

          {/* Text area */}
          <textarea
            ref={textRef}
            id="chat-input"
            className="chat-input"
            rows={1}
            value={input}
            onChange={(e) => {
              setInput(e.target.value);
              e.target.style.height = 'auto';
              e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
            }}
            onKeyDown={handleKey}
            placeholder="Ketik pesan Anda di sini..."
            style={{
              flex: 1,
              padding: '10px 14px',
              minHeight: '42px',
              maxHeight: '120px',
              lineHeight: '1.5',
            }}
          />

          {/* Settings btn */}
          <button id="btn-chat-settings" className="icon-btn" title="Setelan Chat" style={{ marginBottom: '1px' }}>
            <Icons.Settings />
          </button>

          {/* Send btn */}
          <button
            id="btn-send"
            className="icon-btn send"
            title="Kirim"
            onClick={sendMessage}
            style={{
              marginBottom: '1px',
              opacity: input.trim() ? 1 : 0.5,
            }}
          >
            <Icons.Send />
          </button>
        </div>

        <div style={{
          marginTop: '7px',
          fontSize: '0.65rem',
          color: 'rgba(100,150,200,0.3)',
          fontFamily: 'Share Tech Mono',
          textAlign: 'center',
        }}>
          SISI v2.4 • Ollama Llama-3 70B • Enter untuk kirim • Shift+Enter untuk baris baru
        </div>
      </div>
    </div>
  );
}
